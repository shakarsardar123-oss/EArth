name: UI analyze

# Fast compile check of lib/ui only (no APK, no LFS). ~3 minutes.
on:
  push:
    paths:
      - 'lib/ui/**'
      - '.github/workflows/ui-check.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/ui --no-fatal-infos --no-fatal-warnings
