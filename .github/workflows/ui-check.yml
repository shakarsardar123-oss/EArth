name: UI analyze

# Fast compile checks (no APK, no LFS). The result is saved in the branch as
# ui_analyze.txt: run `git pull` then `cat ui_analyze.txt`.
on:
  push:
    branches: [ ui-new ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/ui-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Analyze, compile and save the report
        run: |
          set +e
          {
            flutter --version
            flutter pub get
            echo "----- analyze (new UI + bridge) -----"
            flutter analyze lib/ui lib/bridge lib/core/vision lib/core/ai/gemini_provider.dart --no-fatal-infos --no-fatal-warnings
            echo "analyze exit code: $?"
            echo "----- whole app compile (flutter build bundle) -----"
            flutter build bundle --target=lib/main.dart > bundle_log.txt 2>&1
            echo "bundle exit code: $?"
            grep -n -i "error" bundle_log.txt | head -60
            tail -n 25 bundle_log.txt
          } > ui_analyze.txt 2>&1
          tail -n 80 ui_analyze.txt
      - name: Commit the report
        if: always()
        run: |
          git config user.name "ui-check"
          git config user.email "ui-check@users.noreply.github.com"
          git add ui_analyze.txt
          git commit -m "ui-check: analyze report [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"
