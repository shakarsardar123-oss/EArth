name: Overlay test APK

# Builds a tiny diagnostics app (lib/ui/overlay_test_main.dart) that calls the
# real native overlay bridge. Separate app id, no LFS.
on:
  push:
    branches: [ ui-new ]
    paths:
      - 'lib/ui/overlay_test_main.dart'
      - 'android/app/src/main/kotlin/**'
      - '.github/workflows/overlay-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.4'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Make it a separate app
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/applicationId\([ =]*\)"com\.texo\.texo"/applicationId\1"com.texo.texo.overlaytest"/' "$f"
            fi
          done
          grep -n "applicationId" android/app/build.gradle* || true
          grep -q "com.texo.texo.overlaytest" android/app/build.gradle* || { echo "applicationId was NOT patched"; exit 1; }
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/authorities="com\.texo\.texo\./authorities="com.texo.texo.overlaytest./g' "$M"
          sed -i '0,/android:label="[^"]*"/s//android:label="TEXO overlay test"/' "$M"
      - run: flutter pub get
      - name: Build (the report is saved in the repo as overlay_build.txt)
        run: |
          set +e
          flutter build apk --release -t lib/ui/overlay_test_main.dart --target-platform android-arm64 > build_log.txt 2>&1
          code=$?
          echo "exit code: $code" >> build_log.txt
          grep -n -i "^e: \|error:\|FAILED\|What went wrong" build_log.txt | head -80 > overlay_build.txt
          echo "----- last 40 lines -----" >> overlay_build.txt
          tail -n 40 build_log.txt >> overlay_build.txt
          cat overlay_build.txt
          exit $code
      - name: Commit the build report
        if: always()
        run: |
          git config user.name "overlay-test"
          git config user.email "overlay-test@users.noreply.github.com"
          git add overlay_build.txt
          git commit -m "overlay-test: build report [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"
      - uses: actions/upload-artifact@v4
        with:
          name: texo-overlay-test
          path: build/app/outputs/flutter-apk/app-release.apk
